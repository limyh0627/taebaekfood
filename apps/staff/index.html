<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>태백현장 — 현장 업무 시스템</title>
  <meta name="theme-color" content="#4F46E5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="./manifest-staff.webmanifest" />
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    //  구버전 캐시를 털려고 열 때마다 서비스워커를 지운다(b342f5e).
    //  **알림 것만은 남긴다** — FCM 표(token)는 이 서비스워커의 푸시 구독에 붙어 있어서,
    //  지우면 표가 그 자리에서 죽는다. 열 때마다 죽이는 바람에 폰 하나가 열 때마다 새 표를
    //  받아 한 사람이 32개까지 쌓였다(2026-09-12 확인). 낡은 표로는 알림이 안 간다.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => {
          var sw = r.active || r.waiting || r.installing;
          if (sw && sw.scriptURL.indexOf('firebase-messaging-sw') !== -1) return;
          r.unregister();
        });
      });
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
