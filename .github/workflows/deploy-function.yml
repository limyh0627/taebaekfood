# 서버 함수 하나만 배포한다 (Hosting·Rules·인덱스·운영 자료는 건드리지 않는다).
# 실행: GitHub > Actions > "Deploy one function" > Run workflow, 또는
#   gh workflow run deploy-function.yml --ref <브랜치> -f function=orderProductionBatchCommand
# 선택한 브랜치(--ref)의 코드가 배포된다. main이 아닌 브랜치를 배포했으면 나중에 main에 병합해야
# 다음 배포 때 수정이 빠지지 않는다. 배포 기록은 DB-CHANGELOG.md에 남긴다.
name: Deploy one function

on:
  workflow_dispatch:
    inputs:
      function:
        description: '배포할 함수 이름 (예: orderProductionBatchCommand)'
        required: true
        default: orderProductionBatchCommand

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 함수 이름 확인
        env:
          FN: ${{ inputs.function }}
        run: |
          if ! [[ "$FN" =~ ^[A-Za-z][A-Za-z0-9_]{0,62}$ ]]; then
            echo "함수 이름 형식이 아닙니다: $FN"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: 함수가 index.ts에서 내보내지는지 확인
        env:
          FN: ${{ inputs.function }}
        run: grep -Eq "\b$FN\b" functions/src/index.ts || { echo "functions/src/index.ts에 $FN 이 없습니다"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: 함수 의존성 설치
        run: npm ci --prefix functions --no-audit --no-fund

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_FUNCTIONS_DEPLOY_SA }}

      - name: 배포
        env:
          FN: ${{ inputs.function }}
        run: npx --yes firebase-tools@14 deploy --only "functions:$FN" --project taebaek-3abe4 --non-interactive

      - name: 배포 요약
        if: always()
        env:
          FN: ${{ inputs.function }}
        run: |
          {
            echo "### 함수 배포: \`$FN\`"
            echo "- 브랜치: \`${GITHUB_REF_NAME}\`"
            echo "- 커밋: \`${GITHUB_SHA::8}\`"
            echo "- 결과: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
