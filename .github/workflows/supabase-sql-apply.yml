# Supabase 운영 DB에 함수 파일만 다시 깐다(2026-11-08). 시험 이전(import)은 자료를 지우고 다시 만들어서 잠갔다 — 그 뒤 서버 코드 바꿈은 이걸로 올린다.
# 고른 파일만 supabase-trial 브랜치에서 가져와 돌린다. 자료를 만들거나 옮기는 파일(000·01x·020·021·03x·04x, 이관 기준일 cutover)은 막는다.
# 돌릴 파일은 '다시 돌려도 되는' 것이어야 한다(create or replace, add column if not exists 따위). 로그에는 파일 이름만 찍는다.
# 필요한 Secret: SUPABASE_DB_URL
name: Supabase SQL apply

on:
  workflow_dispatch:
    inputs:
      files:
        description: '돌릴 파일(supabase/sql 안 이름, 띄어쓰기로 여럿). 예: 029zzz…z_mypage.sql'
        required: true
      ref:
        description: '파일을 가져올 브랜치'
        required: true
        default: supabase-trial

permissions:
  contents: read

concurrency:
  group: supabase-trial
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      FILES: ${{ inputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: 파일 확인
        run: |
          for f in $FILES; do
            case "$f" in
              */*|..*) echo "폴더 없이 파일 이름만: $f"; exit 1 ;;
              000_*|01*|020_*|021_*|03*|04*|*_cutover.sql) echo "자료를 만들거나 옮기는 파일은 여기서 못 돌린다: $f"; exit 1 ;;
            esac
            test -f "supabase/sql/$f" || { echo "없는 파일: $f"; exit 1; }
          done
      - name: 적용
        run: |
          for f in $FILES; do
            echo "== $f"
            psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f "supabase/sql/$f" > /dev/null
          done
          echo "끝"
