# Supabase 시험 이전: Firestore를 읽기만 해서 Supabase에 복사·변환하고 대조 결과를 요약에 남긴다.
# 운영(Firestore·앱)에는 아무것도 쓰지 않는다. 여러 번 돌려도 된다(erp 스키마는 매번 새로 만든다).
# 필요한 Secret:
#   SUPABASE_DB_URL               Supabase → Connect → Session pooler 접속 주소(비밀번호 포함)
#   FIREBASE_FUNCTIONS_DEPLOY_SA  서비스 계정 키. 'Cloud Datastore 뷰어' 역할이 있어야 Firestore를 읽을 수 있다.
name: Supabase trial import

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '스크립트를 가져올 브랜치'
        required: true
        default: supabase-trial
      skip_export:
        description: 'Firestore 복사는 건너뛰고 변환·대조만 다시 하기'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-trial
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: 브랜치 이름 확인
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "브랜치 이름 형식이 아닙니다: $REF"; exit 1; }
          [ -n "$SUPABASE_DB_URL" ] || { echo "SUPABASE_DB_URL Secret이 없습니다."; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: psql 확인
        run: psql --version

      - name: 1. 원본 저장소(raw) 준비
        run: psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/sql/000_raw.sql

      - uses: google-github-actions/auth@v2
        if: ${{ !inputs.skip_export }}
        with:
          credentials_json: ${{ secrets.FIREBASE_FUNCTIONS_DEPLOY_SA }}

      - name: 2. Firestore → raw 복사 (읽기만)
        if: ${{ !inputs.skip_export }}
        run: |
          npm install --no-save --no-audit --no-fund --prefix scripts/supabase firebase-admin@12 pg@8
          node scripts/supabase/export-firestore.mjs | tee export.txt

      - name: 3. 새 표 만들기
        run: psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/sql/010_schema.sql

      - name: 4. 변환
        run: psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/sql/020_transform.sql

      - name: 5. 대조
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -f supabase/sql/030_checks.sql | tee checks.txt

      - name: 6. 나머지 컬렉션 모양 조사
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -q -f supabase/sql/040_profile.sql > profile.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-trial-result
          path: |
            checks.txt
            profile.txt
          if-no-files-found: ignore

      - name: 요약
        if: always()
        run: |
          {
            echo "### Supabase 시험 이전 결과"
            if [ -f export.txt ]; then echo; echo "#### Firestore 복사"; sed -n '/^| 컬렉션/,$p' export.txt; fi
            if [ -f checks.txt ]; then echo; echo '#### 대조'; echo '```'; cat checks.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
