<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>태백푸드 ERD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 위에 [ERD 그림|목록] 탭. 휴대폰은 한 화면씩, 넓은 화면은 왼쪽(그림 또는 목록) + 오른쪽 상세 */
:root {
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --ink: #141920;
  --muted: #5A6371;
  --line: #DFE3E8;
  --soft: #E9EDF1;
  --focus: #0B7373;
  --pk: #F4B400;
  --pk-ink: #3F2E00;
  --map-bg: #FFFFFF;
  --map-filter: none;
  --shadow: 0 2px 8px rgb(20 25 32 / 0.14);
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --g-item: #0B8585; --gi-item: #097272;
  --g-partner: #2862D6; --gi-partner: #2254B8;
  --g-order: #D9711A; --gi-order: #BB6116;
  --g-acct: #7448CC; --gi-acct: #643EAF;
  --g-prod: #23915A; --gi-prod: #1E7D4D;
  --g-people: #C9467F; --gi-people: #AD3C6D;
  --g-docs: #9A7417; --gi-docs: #846414;
  --g-haccp: #C2413A; --gi-haccp: #A73832;
  --g-sys: #5F6673; --gi-sys: #525863;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1115; --surface: #161A20; --ink: #E6E9ED; --muted: #97A0AD; --line: #262B33; --soft: #1E232A;
    --focus: #5CC4C4; --pk: #D9A21B; --pk-ink: #1A1300;
    --map-bg: #1F1F1F; --map-filter: invert(0.88) hue-rotate(180deg); --shadow: 0 2px 10px rgb(0 0 0 / 0.5);
    --gi-item: #71B8B8; --gi-partner: #82A4E7; --gi-order: #E9AD7A; --gi-acct: #AE95E1; --gi-prod: #7FBF9F; --gi-people: #E094B5; --gi-docs: #C4AE78; --gi-haccp: #DC918D; --gi-sys: #A2A6AE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1115; --surface: #161A20; --ink: #E6E9ED; --muted: #97A0AD; --line: #262B33; --soft: #1E232A;
  --focus: #5CC4C4; --pk: #D9A21B; --pk-ink: #1A1300;
  --map-bg: #1F1F1F; --map-filter: invert(0.88) hue-rotate(180deg); --shadow: 0 2px 10px rgb(0 0 0 / 0.5);
  --gi-item: #71B8B8; --gi-partner: #82A4E7; --gi-order: #E9AD7A; --gi-acct: #AE95E1; --gi-prod: #7FBF9F; --gi-people: #E094B5; --gi-docs: #C4AE78; --gi-haccp: #DC918D; --gi-sys: #A2A6AE;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
code { font-family: var(--font-data); font-size: 0.86em; overflow-wrap: anywhere; }
a { color: inherit; }
button { font-family: var(--font-ui); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--g, var(--muted)); flex: none; }
.cn { font-family: var(--font-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.wrap { max-width: 1400px; margin: 0 auto; padding-block: 14px 40px; }
/* 긴 내용이 화면을 밀어 넓히지 않게 — 격자 칸은 0까지 줄어들 수 있게 */
.top, .bar, .d, .map, .ov, #mapPane { display: grid; grid-template-columns: minmax(0, 1fr); }
.panes > *, .bar > *, .d > *, .top > *, .grp, .rows, #mapPane > * { min-width: 0; }

.top { gap: 8px; padding-block: 4px 10px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.tabs { display: inline-grid; grid-auto-flow: column; justify-self: start; gap: 2px; padding: 3px; border-radius: 12px; background: var(--soft); }
.tab { height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 14.5px; font-weight: 600; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* 목록 쪽 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); gap: 8px; padding-block: 4px 10px; }
.search { position: relative; }
.search input {
  width: 100%; height: 46px; padding: 0 14px 0 40px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 16px var(--font-ui);
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 13px; top: 14px; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none; height: 34px; padding: 0 12px;
  border-radius: 17px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .cn { color: var(--bg); opacity: 0.75; }
.opts { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
.opts input { width: 18px; height: 18px; accent-color: var(--focus); margin: 0; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

.hubs { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 6px 4px; }
.hubs::-webkit-scrollbar { display: none; }
.hubs .lbl { flex: none; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-right: 2px; }

.tchip {
  display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 6px 10px; border-radius: 9px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 13.5px; text-decoration: none; white-space: nowrap; cursor: pointer;
}
.tchip:hover { border-color: var(--g); }

.list { display: grid; gap: 18px; margin-top: 10px; }
.grp-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 0 0 7px 2px; font-size: 15px; }
.grp-h > span { font-weight: 700; color: var(--gi); }
.grp-h small { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.grp-h .dot { align-self: center; }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; align-items: baseline;
  padding: 11px 14px; border-top: 1px solid var(--line); text-decoration: none;
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--soft); }
.row[aria-current="true"] { background: var(--soft); box-shadow: inset 3px 0 0 var(--g); }
.row .l { font-weight: 600; min-width: 0; }
.row .n { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); }
.row .id { font-family: var(--font-data); font-size: 12.5px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.row .rel { text-align: right; font-family: var(--font-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
.row .hit { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.row.sub .l { color: var(--muted); font-weight: 500; }
.kind { font-style: normal; font-size: 11.5px; font-weight: 500; padding: 1px 6px; border-radius: 6px; background: var(--soft); color: var(--muted); white-space: nowrap; }
mark { background: color-mix(in srgb, var(--focus) 24%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { margin: 24px 4px; color: var(--muted); }

/* ERD 그림 쪽 */
#mapPane { gap: 8px; }
.erd {
  position: relative; height: calc(100dvh - 190px); min-height: 440px; border-radius: 16px; overflow: hidden;
  border: 1px solid var(--line); background: var(--map-bg); touch-action: none; user-select: none; -webkit-user-select: none;
}
.erd > svg { display: block; width: 100%; height: 100%; transform-origin: 0 0; filter: var(--map-filter); will-change: transform; }
.erd [data-card] { cursor: pointer; }
.erd svg.sel [data-card]:not(.on):not(.near) { opacity: 0.2; }
.erd svg.sel [data-edge] { opacity: 0.07; }
.erd svg.sel [data-edge].on { opacity: 1; }
.erd svg [data-edge].on path { stroke-width: 3.2; stroke-opacity: 1; }
.erd svg [data-card].on > rect:first-child { stroke-width: 3; stroke-opacity: 1; }
.erd svg [data-row].on > .hit { fill-opacity: 0.34; }
.zoom { position: absolute; top: 10px; right: 10px; display: grid; gap: 6px; }
.zoom button {
  width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 20px; font-weight: 600; line-height: 1; cursor: pointer; box-shadow: var(--shadow);
}
.zoom button[data-z="fit"] { font-size: 12.5px; }
.info {
  position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; gap: 6px; padding: 10px 12px;
  border-radius: 13px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 14px; max-height: 48%; overflow: auto; touch-action: pan-y;
}
.info.idle { color: var(--muted); font-size: 13px; padding: 8px 12px; }
.ihead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.ihead .tg { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.ihead code { color: var(--muted); }
.ihead .x { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--soft); color: var(--muted); font-size: 18px; cursor: pointer; }
.iline { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.iline code.f { color: var(--ink); font-weight: 600; font-size: 0.95em; }
.iline .ar { color: var(--muted); }
.iline .tgt { font-weight: 700; color: var(--gi); }
.isub { margin: 0; font-size: 12.5px; color: var(--muted); }
.iact { display: flex; flex-wrap: wrap; gap: 6px; }
.iact button, .iact a {
  display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--soft); color: var(--ink); font-size: 13.5px; font-weight: 600; text-decoration: none; cursor: pointer;
}
.iact .pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ichips { display: flex; flex-wrap: wrap; gap: 6px; }

/* 상세 쪽 */
.dtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; }
.back {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14.5px; font-weight: 600; cursor: pointer;
}
.d { gap: 14px; }
.dhead {
  display: grid; gap: 4px; padding: 16px; border-radius: 16px;
  background: color-mix(in srgb, var(--g) 9%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--g) 28%, var(--line));
}
.eyebrow { display: flex; align-items: center; gap: 7px; margin: 0; font-size: 13px; font-weight: 600; color: var(--gi); letter-spacing: 0.02em; }
.dhead h2 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.did { margin: 0; font-family: var(--font-data); font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 10px 0 0; }
.facts div { display: grid; gap: 0; }
.facts dt { font-size: 11.5px; color: var(--muted); }
.facts dd { margin: 0; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kindnote { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); }
.mapbtn {
  justify-self: start; display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; min-height: 36px; padding: 0 12px;
  border-radius: 9px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; text-decoration: none;
}

.map { justify-items: center; gap: 6px; padding: 14px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.map .cap { font-size: 12px; color: var(--muted); }
.map .side { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 100%; }
.map .arrow { color: var(--muted); font-size: 15px; line-height: 1; }
.map .me { padding: 8px 16px; border-radius: 10px; background: var(--gi); color: var(--surface); font-weight: 700; }
.none { color: var(--muted); font-size: 13.5px; margin: 0; }

.blk { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.blk h3 { display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 12px 14px 10px; font-size: 15px; }
.blk > .none { padding: 0 14px 14px; }
.rrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 10px 14px; border-top: 1px solid var(--line); text-decoration: none; }
.rrow:hover { background: var(--soft); }
.rrow .tg { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.rrow .ar { color: var(--muted); }
.rrow code { color: var(--muted); }
.rrow code.f { color: var(--ink); font-weight: 500; }
.bn { font-style: normal; font-size: 11.5px; padding: 1px 6px; border-radius: 6px; border: 1px dashed var(--muted); color: var(--muted); }

.flist { list-style: none; margin: 0; padding: 0; }
.flist li { padding: 9px 14px; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.fl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.fn { font-size: 13.5px; font-weight: 500; color: var(--ink); }
.pk { font: 700 10.5px var(--font-data); padding: 1px 5px; border-radius: 4px; background: var(--pk); color: var(--pk-ink); }
.fk { font-size: 12.5px; font-weight: 600; color: var(--gi); text-decoration: none; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--g) 12%, transparent); }
.ty { margin-left: auto; font-size: 12px; color: var(--muted); }
.fnote { margin: 0; font-size: 12.5px; color: var(--muted); }
.foot { margin: 0; padding: 10px 14px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }

/* 넓은 화면 첫 화면: 묶음 요약 */
.ov { gap: 16px; }
.ov h2 { margin: 0; font-size: 18px; }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.gcard {
  display: grid; gap: 3px; text-align: left; padding: 13px 14px; border-radius: 14px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
}
.gcard:hover { border-color: var(--g); }
.gname { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15.5px; color: var(--gi); }
.gdesc { font-size: 13px; color: var(--muted); }
.gnum { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.howto { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.howto h3 { margin: 0 0 6px; font-size: 15px; }
.howto ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.howto b { color: var(--ink); font-family: var(--font-data); font-weight: 600; }

body:not(.mapview) #mapPane, body.mapview #listPane { display: none; }
@media (max-width: 899.98px) {
  body.viewing #listPane, body.viewing .top, body.viewing #mapPane { display: none; }
  body:not(.viewing) #detail { display: none; }
}
@media (min-width: 900px) {
  .panes { display: grid; grid-template-columns: minmax(330px, 410px) minmax(0, 1fr); gap: 24px; align-items: start; }
  body.mapview .panes { grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); }
  .erd { height: calc(100dvh - 150px); }
  #detail {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
    max-height: calc(100dvh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow: auto; padding-block: 0 24px; overscroll-behavior: contain;
  }
  .dtop, .only-narrow, .iact .only-narrow { display: none; }
  .info { right: 62px; max-width: 640px; }
}
@media (max-width: 420px) {
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>태백푸드 ERD</h1>
      <p>Firestore taebaek-3abe4 · 컬렉션 85개 · 문서 수는 2026-10-21 운영 DB 기준</p>
    </div>
    <div class="tabs" role="tablist" aria-label="보기">
      <button type="button" class="tab" role="tab" data-view="map" id="tabMap">ERD 그림</button>
      <button type="button" class="tab" role="tab" data-view="list" id="tabList">목록</button>
    </div>
  </header>

  <main class="panes">
    <section id="listPane" aria-label="컬렉션 목록">
      <div class="bar">
        <div class="search">
          <label class="sr" for="q">컬렉션·필드 검색</label>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <input id="q" type="search" placeholder="주문, orders, partnerId 처럼 찾기" autocomplete="off" enterkeyhint="search">
        </div>
        <div class="chips" id="chips" role="group" aria-label="묶음으로 거르기"></div>
        <div class="opts">
          <label for="opsToggle"><input type="checkbox" id="opsToggle"> 작업 영수증·안 쓰는 표도 보기 <span class="cn" id="opsN"></span></label>
          <span id="found"></span>
        </div>
      </div>
      <p class="hint">표를 누르면 필드와 연결이 나옵니다. <b>→</b> 가리키는 표 수, <b>←</b> 이 표를 가리키는 표 수.</p>
      <div class="hubs" id="hubs"></div>
      <div class="list" id="list"></div>
    </section>

    <section id="mapPane" aria-label="ERD 그림">

    + `<div class="side">${i.length ? i.map(tchip).join('') : '<span class="none">없음</span>'}</div>`
    + `<span class="arrow" aria-hidden="true">↓</span><span class="me">${esc(t.l)}</span><span class="arrow" aria-hidden="true">↓</span>`
    + `<div class="side">${o.length ? o.map(tchip).join('') : '<span class="none">없음</span>'}</div>`
    + `<span class="cap">이 표가 가리키는 표</span></section>`;

  h += `<section class="blk"><h3>이 표가 가리키는 곳 <span class="cn">${out.length}</span></h3>`
    + (out.length ? out.map(f => `<a class="rrow" href="#${f.fk}"><code class="f">${esc(f.n)}</code><span class="ar">→</span>`
      + `<span class="tg" style="${gv(T[f.fk].g)}"><i class="dot"></i>${esc(T[f.fk].l)}</span><code>${esc(f.fk)}.${esc(f.ff)}</code>${f.bn ? '<em class="bn">이름으로 연결</em>' : ''}</a>`).join('')
      : '<p class="none">다른 표를 가리키는 칸이 없습니다.</p>')
    + `</section>`;

  h += `<section class="blk"><h3>이 표를 가리키는 곳 <span class="cn">${inc.length}</span></h3>`
    + (inc.length ? inc.map(r => `<a class="rrow" href="#${r.from}"><span class="tg" style="${gv(T[r.from].g)}"><i class="dot"></i>${esc(T[r.from].l)}</span>`
      + `<code class="f">${esc(r.from)}.${esc(r.field)}</code><span class="ar">→ 여기</span>${r.bn ? '<em class="bn">이름으로 연결</em>' : ''}</a>`).join('')
      : '<p class="none">이 표를 가리키는 칸이 없습니다.</p>')
    + `</section>`;

  h += `<section class="blk"><h3>필드 <span class="cn">${t.f.length}</span></h3><ul class="flist">`
    + t.f.map(f => `<li><div class="fl"><code class="fn">${esc(f.n)}</code>${f.pk ? '<b class="pk">PK</b>' : ''}`
      + (f.fk ? `<a class="fk" href="#${f.fk}" style="${gv(T[f.fk].g)}">→ ${esc(T[f.fk].l)}</a>` : '')
      + `<span class="ty">${TYPE[f.t] || esc(f.t)}</span></div>${f.note ? `<p class="fnote">${esc(f.note)}</p>` : ''}</li>`).join('')
    + `</ul><p class="foot">모든 문서에 있는 companyId(회사 구분)는 뺐습니다. 필드는 이 컬렉션의 문서 30건을 읽어 모았습니다.</p></section></div>`;
  $('#detail').innerHTML = h;
}

function renderOverview() {
  const inMap = document.body.classList.contains('mapview');
  $('#detail').innerHTML = `<div class="ov"><h2>묶음 ${GROUPS.length}개</h2><div class="gcards">`
    + GROUPS.map(g => {
      const docs = g.ids.reduce((s, id) => s + T[id].c, 0);
      return `<button type="button" class="gcard" data-g="${g.k}" style="${gv(g.k)}"><span class="gname"><i class="dot"></i>${esc(g.name)}</span>`
        + `<span class="gdesc">${esc(g.desc)}</span><span class="gnum">표 ${g.ids.length}개 · 문서 ${docs.toLocaleString()}건</span></button>`;
    }).join('')
    + `</div><div class="howto"><h3>읽는 법</h3><ul>`
    + (inMap
      ? `<li>그림에서 <b>FK</b> 칸을 누르면 그 칸이 가리키는 표와 선만 진하게 보입니다.</li>`
        + `<li><b>PK</b>(id) 칸을 누르면 이 표를 가리키는 칸들이 모두 보입니다.</li>`
        + `<li>표 머리를 누르면 그 표의 연결이 모두 보이고, 오른쪽에 상세가 나옵니다. 빈 곳을 누르면 강조가 풀립니다.</li>`
        + `<li>마우스 휠이나 두 손가락으로 확대하고, 끌어서 옮깁니다.</li>`
      : `<li>왼쪽에서 표를 누르면 필드와 연결이 나옵니다. 연결된 표를 누르면 그 표로 넘어갑니다.</li>`
        + `<li><b>→</b> 는 “이 칸이 저 표의 문서를 가리킨다”는 뜻입니다. 예: 주문의 partnerId → 거래처.</li>`
        + `<li>목록의 <b>→3 ←22</b> 는 가리키는 표 3개, 이 표를 가리키는 표 22개라는 뜻입니다.</li>`)
    + `<li>작업 영수증은 같은 요청이 두 번 반영되지 않게 남기는 기록입니다.</li>`
    + `</ul></div></div>`;
}

/* ───────── ERD 그림 ───────── */
const svg = $('#erdSvg'), erdEl = $('#erd'), info = $('#info');
// wantFocus: 주소로 바로 열었거나 "그림에서 위치 보기"를 눌렀을 때만 그 상자로 옮긴다(뒤로 가기로 돌아올 땐 그대로)
let vb = { x: 0, y: 0, w: DIA.W, h: DIA.H }, cvb = { ...vb }, mapReady = false, sel = null, wantFocus = true;
const rect = () => erdEl.getBoundingClientRect();
function fitAspect(v) {
  const r = rect(), a = r.width / Math.max(1, r.height);
  const cx = v.x + v.w / 2, cy = v.y + v.h / 2;
  let w = v.w, h = v.h;
  if (w / h > a) h = w / a; else w = h * a;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}
// 움직이는 동안은 가벼운 CSS 변형으로 보여 주고, 손을 떼면 viewBox 를 바꿔 다시 그린다(글자가 선명해진다)
function draw(live) {
  if (live) {
    const r = rect(), k = r.width / vb.w, k0 = r.width / cvb.w;
    svg.style.transform = `translate(${(cvb.x - vb.x) * k}px, ${(cvb.y - vb.y) * k}px) scale(${k / k0})`;
  } else {
    cvb = { ...vb };
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    svg.style.transform = '';
  }
}
const MINW = 150, MAXW = DIA.W * 1.6;
function zoomAt(cx, cy, f) {
  const r = rect(), px = (cx - r.left) / r.width, py = (cy - r.top) / r.height;
  const nw = Math.min(MAXW, Math.max(MINW, vb.w / f)), nh = nw * vb.h / vb.w;
  vb = { x: vb.x + px * (vb.w - nw), y: vb.y + py * (vb.h - nh), w: nw, h: nh };
}
function panBy(dx, dy) { const r = rect(); vb.x -= dx * vb.w / r.width; vb.y -= dy * vb.h / r.height; }
function fitTo(b, pad = 24) { vb = fitAspect({ x: b.x - pad, y: b.y - pad, w: b.w + pad * 2, h: b.h + pad * 2 }); draw(false); }
const fitAll = () => fitTo({ x: 0, y: 0, w: DIA.W, h: DIA.H }, 8);
const cardEl = id => svg.querySelector(`[data-card="${id}"]`);
function focusCard(id) {
  const el = cardEl(id); if (!el) return;
  const b = el.getBBox(), r = rect();
  // 상자가 휴대폰에선 화면 폭의 70%, 넓은 화면에선 30% 정도가 되게. 휴대폰은 아래 안내 칸에 가리지 않게 조금 위로.
  const w = Math.max(b.width / (narrow() ? 0.7 : 0.3), b.width + 120), h = w * r.height / r.width;
  fitTo({ x: b.x + b.width / 2 - w / 2, y: b.y + b.height / 2 - h / 2 + (narrow() ? h * 0.14 : 0), w, h }, 0);
}

function initMap() {
  if (!mapReady) {
    mapReady = true;
    $('#mapChips').innerHTML = GROUPS.map(g => `<button type="button" class="chip" data-k="${g.k}" style="${gv(g.k)}"><i class="dot"></i>${esc(g.name)}</button>`).join('');
    fitAll();
    idleInfo();
  } else { vb = fitAspect(vb); draw(false); }
}

// 선택·강조
function clearMarks() { svg.classList.remove('sel'); svg.querySelectorAll('.on, .near').forEach(n => n.classList.remove('on', 'near')); }
function mark({ on = [], near = [], edges = [], rows = [] }) {
  clearMarks(); svg.classList.add('sel');
  on.forEach(id => cardEl(id)?.classList.add('on'));
  near.forEach(id => cardEl(id)?.classList.add('near'));
  edges.forEach(e => e.classList.add('on'));
  rows.forEach(r => r && r.classList.add('on'));
}
const rowEl = (id, i) => cardEl(id)?.querySelector(`[data-row="${i}"]`);
const pkRow = id => rowEl(id, (DIA.rows[id] || []).findIndex(f => f[0] === 'pk'));
const edgesFrom = (id, i) => [...svg.querySelectorAll(`[data-edge][data-s="${id}"]${i == null ? '' : `[data-i="${i}"]`}`)];
const edgesTo = id => [...svg.querySelectorAll(`[data-edge][data-t="${id}"]`)];
const realField = (id, text) => (id === 'fileCabinetDocs' && text.startsWith('category') ? 'subCategory' : (text.match(/^[A-Za-z_]+/) || [text])[0]);

function infoHead(id) {
  return `<div class="ihead"><span class="tg" style="${gv(T[id].g)}"><i class="dot"></i>${esc(T[id].l)}</span><code>${esc(id)}</code>`
    + `<button type="button" class="x" data-act="clear" aria-label="강조 끄기">×</button></div>`;
}
const detailBtn = id => `<button type="button" class="only-narrow" data-act="detail" data-id="${id}">${esc(short(id))} 상세</button>`;
function idleInfo() {
  info.className = 'info idle';
  info.innerHTML = '칸을 누르면 어디로 연결되는지 보입니다. 두 손가락으로 확대·이동하세요.';
}
function showInfo(html) { info.className = 'info'; info.innerHTML = html; info.scrollTop = 0; }
function sideDetail(id) { if (!narrow()) { cur = id; renderDetail(id); $('#detail').scrollTop = 0; } }

function selectRow(id, i) {
  const f = (DIA.rows[id] || [])[i]; if (!f) return selectTable(id);
  sel = id;
  if (f[0] === 'fk') {
    const t = f[2], real = realField(id, f[1]);
    const fld = T[id].f.find(x => x.n === real);
    mark({ on: [id, t], edges: edgesFrom(id, i), rows: [rowEl(id, i), pkRow(t)] });
    showInfo(infoHead(id)
      + `<p class="iline"><code class="f">${esc(f[1])}</code><span class="ar">→</span><span class="tgt" style="${gv(T[t].g)}">${esc(T[t].l)}</span><code>${esc(t)}.${esc(fld?.ff || 'id')}</code>${f[3] ? '<em class="bn">이름으로 연결</em>' : ''}</p>`
      + (fld?.note ? `<p class="isub">${esc(fld.note)}</p>` : '')
      + `<div class="iact"><button type="button" class="pri" data-act="go" data-id="${t}">${esc(short(t))} 보러 가기</button>${detailBtn(id)}</div>`);
  } else if (f[0] === 'pk') {
    const inc = IN[id], drawn = edgesTo(id);
    mark({ on: [id], near: inT(id), edges: drawn, rows: [rowEl(id, i), ...drawn.map(e => rowEl(e.dataset.s, e.dataset.i))] });
    showInfo(infoHead(id)
      + `<p class="iline"><code class="f">${esc(f[1])}</code><span class="ar">← 이 표를 가리키는 칸 ${inc.length}개</span></p>`
      + (inc.length ? `<div class="ichips">${inc.map(r => `<button type="button" class="tchip" data-act="go" data-id="${r.from}" style="${gv(T[r.from].g)}"><i class="dot"></i>${esc(short(r.from))} <code>${esc(r.field)}</code></button>`).join('')}</div>` : '<p class="isub">이 표를 가리키는 칸이 없습니다.</p>')
      + `<div class="iact">${detailBtn(id)}</div>`);
  } else {
    mark({ on: [id], rows: [rowEl(id, i)] });
    showInfo(infoHead(id) + `<p class="iline"><code class="f">${esc(f[1])}</code></p><p class="isub">다른 표와 이어지지 않는 칸입니다.</p><div class="iact">${detailBtn(id)}</div>`);
  }
  sideDetail(id);
}
function selectTable(id) {
  sel = id;
  mark({ on: [id], near: uniq([...outT(id), ...inT(id)]), edges: [...edgesFrom(id), ...edgesTo(id)] });
  const o = outT(id), i = inT(id);
  showInfo(infoHead(id)
    + `<p class="isub">문서 ${T[id].c.toLocaleString()}건 · 가리키는 표 ${o.length} · 이 표를 가리키는 표 ${i.length}${T[id].k !== 'core' ? ' · ' + KIND[T[id].k] : ''}</p>`
    + (o.length + i.length ? `<div class="ichips">${uniq([...o, ...i]).map(x => `<button type="button" class="tchip" data-act="go" data-id="${x}" style="${gv(T[x].g)}"><i class="dot"></i>${esc(short(x))}</button>`).join('')}</div>` : '')
    + `<div class="iact">${detailBtn(id)}</div>`);
  sideDetail(id);
}
function clearSel() {
  sel = null; clearMarks(); idleInfo();
  if (!narrow()) { cur = null; renderOverview(); }
}

// 손가락·마우스
const pts = new Map();
let start = null, moved = 0, pinch = null, wheelT = 0;
erdEl.addEventListener('pointerdown', e => {
  if (e.target.closest('.info, .zoom')) return;
  erdEl.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { start = { target: e.target }; moved = 0; } else { start = null; }
  pinch = null;
});
erdEl.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  const nx = e.clientX, ny = e.clientY;
  if (pts.size === 1) { panBy(nx - p.x, ny - p.y); moved += Math.abs(nx - p.x) + Math.abs(ny - p.y); }
  pts.set(e.pointerId, { x: nx, y: ny });
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) { panBy(mid.x - pinch.mid.x, mid.y - pinch.mid.y); zoomAt(mid.x, mid.y, dist / pinch.dist); }
    pinch = { mid, dist }; moved = 99;
  }
  draw(true);
});
function endPointer(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  pinch = null;
  if (pts.size === 0) {
    draw(false);
    if (start && moved < 8 && e.type === 'pointerup') tapAt(start.target);
    start = null;
  }
}
erdEl.addEventListener('pointerup', endPointer);
erdEl.addEventListener('pointercancel', endPointer);
erdEl.addEventListener('wheel', e => {
  if (e.target.closest('.info')) return;
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
  draw(true);
  clearTimeout(wheelT); wheelT = setTimeout(() => draw(false), 140);
}, { passive: false });

function tapAt(target) {
  const card = target.closest && target.closest('[data-card]');
  if (!card) { clearSel(); return; }
  const row = target.closest('[data-row]');
  if (row) selectRow(card.dataset.card, +row.dataset.row); else selectTable(card.dataset.card);
}
erdEl.addEventListener('click', e => {
  const z = e.target.closest('[data-z]');
  if (z) {
    const r = rect();
    if (z.dataset.z === 'fit') fitAll();
    else { zoomAt(r.left + r.width / 2, r.top + r.height / 2, z.dataset.z === 'in' ? 1.6 : 1 / 1.6); draw(false); }
    return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id;
  if (a.dataset.act === 'clear') clearSel();
  else if (a.dataset.act === 'go') { selectTable(id); focusCard(id); }
  else if (a.dataset.act === 'detail') location.hash = id;
});
$('#mapChips').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  const g = DIA.groups[b.dataset.k]; if (g) fitTo(g, 12);
});
addEventListener('resize', () => { if (mapReady && document.body.classList.contains('mapview')) { vb = fitAspect(vb); draw(false); } });

/* ───────── 화면 전환 ───────── */
function parse() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'map' || h.startsWith('map.')) { const id = h.slice(4); return { view: 'map', id: T[id] ? id : null }; }
  return { view: 'list', id: T[h] ? h : null };
}
function route() {
  const r = parse(), nar = narrow();
  document.body.classList.toggle('mapview', r.view === 'map');
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === r.view)));
  store.set('view', r.view);
  if (r.view === 'map') {
    document.body.classList.remove('viewing');
    initMap();
    if (r.id && wantFocus) { selectTable(r.id); focusCard(r.id); }
    wantFocus = false;
    if (!nar) { if (sel) { cur = sel; renderDetail(sel); } else { cur = null; renderOverview(); } }
    if (nar) window.scrollTo(0, 0);
    return;
  }
  wantFocus = false;
  if (r.id) {
    if (!cur && nar) listY = window.scrollY;
    cur = r.id;
    document.body.classList.add('viewing');
    renderDetail(r.id);
    if (nar) window.scrollTo(0, 0); else $('#detail').scrollTop = 0;
  } else {
    const was = cur;
    cur = null;
    document.body.classList.remove('viewing');
    renderOverview();
    if (was && nar) window.scrollTo(0, listY);
  }
  document.querySelectorAll('.row').forEach(a => {
    if (a.getAttribute('href') === '#' + cur) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  });
}

function setGroup(g) { S.g = g; store.set('g', g); renderChips(); renderList(); }
$('#q').addEventListener('input', e => { S.q = e.target.value.trim().toLowerCase(); renderList(); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) setGroup(b.dataset.g); });
$('#opsToggle').addEventListener('change', e => { S.ops = e.target.checked; store.set('ops', S.ops); renderChips(); renderList(); });
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  location.hash = b.dataset.view === 'map' ? 'map' : (cur && !document.body.classList.contains('mapview') ? cur : '');
  if (b.dataset.view === 'list' && !location.hash.slice(1)) route();
});
$('#detail').addEventListener('click', e => {
  if (e.target.closest('#back')) { if (navs > 0) history.back(); else location.hash = ''; return; }
  const m = e.target.closest('[data-mapfocus]');
  if (m) {
    wantFocus = true;
    if (location.hash === '#map.' + m.dataset.mapfocus) { e.preventDefault(); route(); }
    return;
  }
  const c = e.target.closest('.gcard');
  if (c) {
    if (document.body.classList.contains('mapview')) { const g = DIA.groups[c.dataset.g]; if (g) fitTo(g, 12); }
    else { setGroup(c.dataset.g); $('#listPane').scrollIntoView({ block: 'start' }); }
  }
});
addEventListener('hashchange', () => { navs++; route(); });

renderChips();
renderHubs();
renderList();
// 처음 여는 사람은 ERD 그림부터. 고른 보기는 기억한다.
if (!location.hash && store.get('view', 'map') === 'map') {
  try { history.replaceState(null, '', '#map'); } catch { location.hash = 'map'; }
}
route();
</script>

</body></html>
