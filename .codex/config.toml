# 이 폴더에서 Codex 가 어떻게 굴지 — 개인 설정(~/.codex/config.toml)보다 이게 이긴다.
# 처음 열 때 "이 프로젝트를 믿느냐"고 물으면 예라고 해야 이 파일이 읽힌다.
#
# 모델은 일부러 안 적는다 — 요금제마다 쓸 수 있는 게 다르고, 여기 박아 두면 금방 낡는다.

# 폴더 안은 고쳐도 되고, 밖으로는 못 나간다.
sandbox_mode = "workspace-write"

# 폴더 밖으로 나가거나 인터넷을 쓸 일이 생기면 그때 물어본다.
# 'never' 로 풀지 마라 — 이 앱은 배포·DB 수정이 되돌리기 어렵다.
approval_policy = "on-request"

# 인터넷은 기본이 꺼짐이다. **일부러 안 켠다.**
#   이 앱에서 되돌리기 어려운 일은 전부 인터넷 너머에 있다 —
#   배포(Firebase Hosting)와 DB 수정(Firestore). 파일은 git 으로 되돌리지만 그 둘은 못 되돌린다.
#   꺼 두면 그런 명령에서 Codex 가 멈추고 물어본다. 그 물음이 마지막 방어선이다.
# [sandbox_workspace_write]
# network_access = true
